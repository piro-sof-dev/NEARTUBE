<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEARTUBE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
</head>
<body>
    <header>
        <h2>⚡ NEARTUBE</h2>
    </header>

    <main>
        <div class="input-container">
            <input type="text" id="videoUrlInput" placeholder="Paste YouTube URL or Video ID (e.g., dQw4w9WgXcQ)">
            <button id="loadBtn">Play Securely</button>
        </div>

        <div id="playerContainer" class="player-wrapper">
            <p class="placeholder-text">Enter a video ID to load lightweight player.</p>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for true PWA offline support
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('PWA Service Worker Registered'))
                .catch((err) => console.log('SW Registration Failed', err));
        }
    </script>
</body>
</html>
