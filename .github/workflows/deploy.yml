name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Environment Variables into App
        run: |
          # Automatically replace placeholders in public/app.js with GitHub Repository Secrets
          sed -i 's|__INJECT_BACKEND_URL__|https://neartube.onrender.com|g' public/app.js
          sed -i 's|__INJECT_APP_SECRET__|${{ secrets.RENDER_APP_SECRET }}|g' public/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
